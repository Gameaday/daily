name: release

# A tag push is the release act: build the two bundles, attach them to a
# GitHub release. validate.yml also runs on tag pushes (it triggers on
# every push), so a tag is always fully validated; the Pi deploys a tag
# only after its validate run is green.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-bundles.mjs
      - name: zip bundles
        run: |
          cd dist/offline && zip -rq ../../offline-bundle.zip .
          cd ../online && zip -rq ../../online-bundle.zip .
      - name: create or update release
        run: |
          FLAGS="--generate-notes"
          case "$GITHUB_REF_NAME" in *-rc*|*-beta*) FLAGS="$FLAGS --prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # the release already exists (hand-created, or a re-run of this
            # workflow): converge by (re)uploading the fresh bundles
            gh release upload "$GITHUB_REF_NAME" offline-bundle.zip online-bundle.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" $FLAGS --title "$GITHUB_REF_NAME" offline-bundle.zip online-bundle.zip
          fi
        env:
          GH_TOKEN: ${{ github.token }}
