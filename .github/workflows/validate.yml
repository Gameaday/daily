name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Layer 1 - compile every game + shell/id/landing checks
        run: node checks/games.js
      - name: Layer 2 - play every game headless to a win/loss + rollover
        run: node tests/run.js
      - name: Layer 3 - scores service API test (spawn + urllib)
        run: python3 tests/server_test.py
