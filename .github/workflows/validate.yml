name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Guard - no "team" wording outside dictionaries
        run: |
          matches=$(grep -RInE '\bteam\b' . \
            --exclude-dir=.git \
            --exclude='wordlist-20210729.txt' \
            --exclude='wordlist-clean.txt' \
            --exclude='words-en.js' \
            --exclude='valid-en.js' | grep -v 'sprint/index.html' || true)
          if [ -n "$matches" ]; then
            echo "::error::'team' found outside allowed dictionary/wordlist files"
            echo "$matches"
            exit 1
          fi
      - name: Generate server-side puzzle store
        run: node tools/export-puzzles.mjs
      - name: Layer 1 - compile every game + shell/id/landing checks
        run: node checks/games.js
      - name: Layer 2 - play every game headless to a win/loss + rollover
        run: node tests/run.js
      - name: Layer 3 - scores service API test (spawn + urllib)
        run: python3 tests/server_test.py
      - name: Build online + offline bundles
        run: node tools/build-bundles.mjs
      - name: Upload offline bundle
        uses: actions/upload-artifact@v4
        with:
          name: offline-bundle
          path: dist/offline
      - name: Upload online bundle
        uses: actions/upload-artifact@v4
        with:
          name: online-bundle
          path: dist/online
