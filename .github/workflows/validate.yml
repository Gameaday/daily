name: validate

on:
  push:
  pull_request:

jobs:
  games:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile every game and check the shared shell
        run: node checks/games.js
      - name: Byte-compile the scores server
        run: python3 -m py_compile scores/server.py && echo "server.py ok"
