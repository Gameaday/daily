name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate server-side puzzle store
        run: node tools/export-puzzles.mjs
      - name: Layer 1 - compile every game + shell/id/landing checks
        run: |
          set -o pipefail
          node checks/games.js 2>&1 | tee /tmp/l1.log || { grep -E 'FAIL|failure' /tmp/l1.log | head -10 | sed 's/^/::error::/'; exit 1; }
      - name: Layer 2 - play every game headless to a win/loss + rollover
        run: |
          set -o pipefail
          node tests/run.js 2>&1 | tee /tmp/l2.log || { grep -E 'FAIL|EXCEPTION|TOTAL' /tmp/l2.log | head -25 | sed 's/^/::error::/'; exit 1; }
      - name: Layer 3 - scores service API test (spawn + urllib)
        run: |
          set -o pipefail
          python3 tests/server_test.py 2>&1 | tee /tmp/l3.log || { tail -10 /tmp/l3.log | sed 's/^/::error::/'; exit 1; }
      - name: Build online + offline bundles
        run: node tools/build-bundles.mjs
      - name: Upload offline bundle
        uses: actions/upload-artifact@v4
        with:
          name: offline-bundle
          path: dist/offline
      - name: Upload online bundle
        uses: actions/upload-artifact@v4
        with:
          name: online-bundle
          path: dist/online
