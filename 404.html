<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>404 &middot; Warmup</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'20height='100'%20rx='22'%20fill='%23f7f1e5'/%3E%3Ccircle%20cx='50'%20cy='50'%20r='43'%20fill='%23fffdf7'%20stroke='%23e5dbc8'%20stroke-width='3'/%3E%3Ctext%20x='50'%20y='71'%20font-size='58'%20font-family='Georgia,serif'%20font-weight='bold'%20text-anchor='middle'%20fill='%23b3541e'%3EW.%3C/text%3E%3C/svg%3E"/>
<style>
  :root{ --paper:#f7f1e5; --card:#fffdf7; --ink:#272117; --muted:#7a6f5d; --accent:#b3541e; --line:#e5dbc8; }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif; line-height:1.6;}
  main{max-width:520px; margin:0 auto; padding:96px 20px; text-align:center;}
  .code{font-family:Georgia,serif; font-size:64px; color:var(--accent); margin:0; line-height:1;}
  h1{font-family:Georgia,serif; font-size:34px; margin:12px 0 6px;}
  p{color:var(--muted); font-size:15px; margin:0 0 28px;}
  a.btn{display:inline-block; background:var(--accent); color:var(--card); text-decoration:none; font-weight:700; font-size:14px; padding:12px 22px; border-radius:10px;}
  html.night{ --paper:#17162e; --card:#251f3d; --ink:#f6dfbe; --muted:#a3947c; --accent:#f5c46b; --line:#3b3552; color-scheme:dark; }
</style>
<script>
  (function(){
    /* the 404 stands alone: no shell, but it knows the site's night
       when it sees one, so a dead link never blinds a night visitor */
    try {
      var m = localStorage.getItem('warmup.mode') || 'day';
      if (m === 'night' ||
          (m === 'auto' && window.matchMedia &&
            matchMedia('(prefers-color-scheme: dark)').matches)){
        document.documentElement.classList.add('night');
        var icon = document.querySelector('link[rel="icon"]');
        if (icon) icon.setAttribute('href', 'data:image/svg+xml,' +
          encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='#17162e'/><circle cx='50' cy='50' r='43' fill='#251f3d' stroke='#3b3552' stroke-width='3'/><text x='43' y='71' font-size='58' font-family='Georgia,serif' font-weight='bold' text-anchor='middle' fill='#f6dfbe'>W</text><circle cx='79' cy='65' r='7' fill='none' stroke='#f5c46b' stroke-width='1.7'/></svg>"));
      }
    } catch (e){}
  })();
</script>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>Not one of the games.</h1>
  <p>This page does not exist, but seventeen morning puzzles do.</p>
  <a class="btn" href="/">Back to today's warmup</a>
</main>
</body>
</html>
