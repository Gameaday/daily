# Docker deploy for the Pi, another PC, or anywhere: this compose file plus
# .env is the whole deployment. No repo checkout, no tokens, no host-side
# update machinery.
#   docker compose up -d
#
# web     - Caddy serving the online bundle baked into the image (no puzzle
#           banks inside; puzzles are served by the scores service). Plain
#           HTTP on host port WEB_PORT (default 8081, set in .env): point
#           your edge proxy (Traefik, nginx, ...) at it for TLS/domains.
#           The repo needs no domain config.
# scores  - the global-curve + puzzle-delivery service; internal network
#           only, no capabilities, 64 MB cap. Only fresh-day plays count
#           toward the live curve; each finished day collapses into a
#           static archive snapshot under DATA_DIR (default
#           /opt/data/daily), the one writable path, so the stack survives
#           host rebuilds and moves when that directory does.
#
# Images come from GHCR (ghcr.io/gameaday/daily-web, daily-scores); the
# release workflow builds and pushes them for every green v* tag.
#   Update to the newest release:   docker compose pull && docker compose up -d
#   Pin or roll back to one release: set TAG=v1.0.0 in .env first.

services:
  web:
    image: ghcr.io/gameaday/daily-web:${TAG:-latest}
    restart: unless-stopped
    ports:
      # plain HTTP entry point - the edge proxy terminates TLS elsewhere
      - "${WEB_PORT:-8081}:80"
    environment:
      SCORES_UPSTREAM: ${SCORES_UPSTREAM:-scores:8787}
    depends_on:
      scores:
        condition: service_healthy

  scores:
    image: ghcr.io/gameaday/daily-scores:${TAG:-latest}
    restart: unless-stopped
    # hardened on purpose: read-only except the archive dir, no caps
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    volumes:
      # the only writable path: end-of-day archive snapshots
      - ${DATA_DIR:-/opt/data/daily}/archive:/app/archive
    expose:
      - "8787"
    healthcheck:
      # the API answers /health; the web container waits for this before
      # proxying to it (a slow scores boot no longer 502s the first hits)
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
