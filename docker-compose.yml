# Docker deploy for the Pi (or any small host) - self-contained by design.
#   docker compose up -d --build
#
# web     - Caddy serving the online bundle baked into the image (no puzzle
#           banks inside; puzzles are served by the scores service). Plain
#           HTTP on host port WEB_PORT (default 8081, set in .env): point
#           your edge proxy (Traefik, nginx, ...) at it for TLS/domains.
#           The repo needs no domain config.
# scores  - the global-curve + puzzle-delivery service; internal network
#           only, no capabilities, 64 MB cap. Only fresh-day plays count
#           toward the live curve; each finished day collapses into a
#           static archive snapshot on the scores-archive volume (written
#           once, then read-only).
#
# Updating: `make deploy` (or the update timer) deploys the newest stable
# v* tag once its validate run is green on that exact commit and rebuilds
# the containers - a rebuild is what ships new site content now that the
# site is baked in. The Pi never tracks main; pushing a tag is the deploy act.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      # plain HTTP entry point - the edge proxy terminates TLS elsewhere
      - "${WEB_PORT:-8081}:80"
    environment:
      SCORES_UPSTREAM: ${SCORES_UPSTREAM:-scores:8787}
    depends_on:
      scores:
        condition: service_healthy

  scores:
    build:
      context: .
      dockerfile: Dockerfile.scores
    restart: unless-stopped
    # hardened on purpose: read-only except the archive volume, no caps
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    volumes:
      # the only writable path: end-of-day archive snapshots
      - scores-archive:/app/archive
    expose:
      - "8787"
    healthcheck:
      # the API answers /health; the web container waits for this before
      # proxying to it (a slow scores boot no longer 502s the first hits)
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  scores-archive:
