# Docker deploy for the Pi (or any small host).
#   cp .env.example .env   # edit DAILY_DOMAIN
#   docker compose up -d --build
#
# web     - Caddy serving this repo read-only from /srv/daily, TLS automatic
# scores  - the in-memory global-curve service; internal network only,
#           read-only filesystem, no capabilities, 64 MB cap. It keeps
#           consolidated per-day numbers only and forgets everything on
#           restart - by design.
#
# Updating after a git push: `make deploy` (or the GitHub Actions SSH deploy)
# pulls main and recreates the containers.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DAILY_DOMAIN: ${DAILY_DOMAIN:-daily.historylabs.dev}
      SCORES_UPSTREAM: scores:8787
    volumes:
      # the whole site, read-only - Caddy can never write into the repo
      - ./:/srv/daily:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - scores

  scores:
    build:
      context: .
      dockerfile: Dockerfile.scores
    restart: unless-stopped
    # hardened on purpose: no disk writes ever, no new privileges, no caps
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    expose:
      - "8787"

volumes:
  caddy_data:
  caddy_config:
