# Docker deploy for the Pi (or any small host) - self-contained by design.
#   docker compose up -d --build
#
# web     - Caddy serving the online bundle baked into the image (no puzzle
#           banks inside; puzzles are served by the scores service). Plain
#           HTTP on host port 8080: point your edge proxy (Traefik, nginx,
#           ...) at it for TLS/domains. The repo needs no domain config.
# scores  - the global-curve + puzzle-delivery service; internal network
#           only, no capabilities, 64 MB cap. Only fresh-day plays count
#           toward the live curve; each finished day collapses into a
#           static archive snapshot on the scores-archive volume (written
#           once, then read-only).
#
# Updating after a git push: `make deploy` (or the update timer) pulls
# main when CI is green on that exact commit and rebuilds the containers -
# a rebuild is what ships new site content now that the site is baked in.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      # plain HTTP entry point - the edge proxy terminates TLS elsewhere
      - "8080:80"
    environment:
      SCORES_UPSTREAM: ${SCORES_UPSTREAM:-scores:8787}
    depends_on:
      - scores

  scores:
    build:
      context: .
      dockerfile: Dockerfile.scores
    restart: unless-stopped
    # hardened on purpose: read-only except the archive volume, no caps
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    volumes:
      # the only writable path: end-of-day archive snapshots
      - scores-archive:/app/archive
    expose:
      - "8787"

volumes:
  scores-archive:
